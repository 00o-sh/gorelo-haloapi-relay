name: Swagger drift

# Nightly poll of the live upstream OpenAPI specs. When one no longer matches its
# committed snapshot (docs/gorelo-swagger.v1.json / docs/halo-swagger.v2.json), open
# (or refresh) a per-spec PR that updates the snapshot, with a summary of what changed.
# The relay derives code from both specs — Gorelo types (src/types.ts) and the Halo
# mock (src/halo.ts, src/haloShapes.ts) — so a drift PR is the prompt to re-check those.
# Runs on a schedule and on demand.

on:
  schedule:
    # 05:12 UTC daily — an off-peak, non-round minute so it isn't lost in the
    # top-of-hour scheduling crush GitHub warns about.
    - cron: "12 5 * * *"
  workflow_dispatch:

# Least privilege: update the snapshot branch and open/refresh its PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    name: ${{ matrix.spec }} spec drift
    runs-on: ubuntu-latest
    strategy:
      # One spec's fetch failing (or drifting) must not cancel the other.
      fail-fast: false
      matrix:
        spec: [gorelo, halo]
    # Serialize each spec's runs independently so a schedule + dispatch overlap can't
    # race the same branch; different specs still run in parallel.
    concurrency:
      group: swagger-drift-${{ matrix.spec }}
      cancel-in-progress: false
    env:
      SPEC: ${{ matrix.spec }}
      BRANCH: automation/${{ matrix.spec }}-swagger-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync snapshot from the live spec
        id: sync
        run: |
          set -euo pipefail
          # Rewrites the spec's snapshot in place and prints a change summary
          # (comparing the committed snapshot to the live spec). Only this spec's
          # snapshot can change, so a whole-tree diff check is sufficient.
          python3 scripts/sync-swagger.py "$SPEC" --summary | tee /tmp/drift-summary.md
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the snapshot PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync ${SPEC} swagger snapshot from live spec"
          git push --force-with-lease origin "$BRANCH"

          # Build the PR body from the drift summary.
          {
            echo "Automated update of the committed ${SPEC} OpenAPI snapshot to match its live spec."
            echo
            echo "## What changed"
            echo
            cat /tmp/drift-summary.md
            echo
            echo "The relay derives code from this spec (Gorelo types \`src/types.ts\` / the Halo mock"
            echo "\`src/halo.ts\`, \`src/haloShapes.ts\`), so please re-check that code and the mock"
            echo "responses against the diff before merging."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/pr-body.md

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr-body.md
            echo "Refreshed existing PR #$existing"
          else
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore: sync ${SPEC} swagger snapshot from live spec" \
              --body-file /tmp/pr-body.md
          fi
